<style>
  /* Layout: single column mobile app, bottom tab bar, full-screen sheet for data entry */

  .btn { width: 100%; min-height: 52px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 17px; margin-top: 20px; }
  .btn.ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--line); margin-top: 10px; }

  .banner { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: start; background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }

  .acts button { min-height: 46px; border-radius: 12px; border: 0; font-weight: 600; }

  .paybtn { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .err { color: var(--bad); font-size: 14px; margin-top: 12px; min-height: 1px; }
  #toast { position: fixed; inset-inline: 0; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; z-index: 30; pointer-events: none; }
  #toast span { background: var(--fg); color: var(--bg); border-radius: 999px; padding: 9px 18px; font-size: 14px; }
  @media (prefers-reduced-motion: no-preference) { #toast span { animation: pop .2s ease-out; } @keyframes pop { from { transform: translateY(8px); opacity: 0; } } }

<script>(function () {
  var KEY = 'farm.v1', BKEY = 'farm.v1.backup';

    var raw = localStorage.getItem(KEY);

  } catch (e) { }

  function newId() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7) + (seq++).toString(36); }
  function docSnap(c, id) { var ex = has(c, id); return { id: id, exists: ex, data: function () { return ex ? clone(data[c][id]) : undefined; }, metadata: {} }; }

  function fire(key, snap) { (listeners[key] || []).slice().forEach(function (f) { try { f(snap()); } catch (e) { } }); }
  function notify(c, id) { fire('c:' + c, function () { return collSnap(c); }); fire('d:' + c + '/' + id, function () { return docSnap(c, id); }); }
  function notifyAll() {
    COLS.forEach(function (c) {
      fire('c:' + c, function () { return collSnap(c); });
      Object.keys(listeners).forEach(function (k) { var p = 'd:' + c + '/'; if (k.indexOf(p) === 0) { var id = k.slice(p.length); fire(k, function () { return docSnap(c, id); }); } });

    var count = 0;

<script>
(function () {

    var s = String(v).replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }).replace(/٫/g, '.').replace(/[,،\s]/g, '');
    var n = parseFloat(s); return isFinite(n) ? n : 0;
  }
  function fmt(n) { n = Math.round((n + Number.EPSILON) * 100) / 100; return Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
  function fmtN(n, d) { return Number(Number(n).toFixed(d)).toLocaleString('en-US', { maximumFractionDigits: d }); }
  function N(n) { return '<span class="num">' + fmt(n) + '</span>'; }

  var TYPE_KEYS = ['funding', 'expenses', 'incoming', 'outgoing', 'production', 'waste', 'payroll'];

  // ---------- calculations (same logic as the Excel workbook) ----------
  function compute() {
    var S = state, c = {};
    c.funding = sum(S.funding, function (x) { return num(x.amount); });
    c.exp = sum(S.expenses, function (x) { return num(x.amount); });
    c.incTotal = sum(S.incoming, function (x) { return num(x.qty) * num(x.price); });
    c.incPaid = sum(S.incoming, function (x) { return num(x.paid); });
    c.salTotal = sum(S.payroll, netOf);
    c.salPaid = sum(S.payroll, function (x) { return x.paid === 'yes' ? netOf(x) : 0; });
    c.rev = sum(S.outgoing, function (x) { return num(x.qty) * num(x.price); });
    c.collected = sum(S.outgoing, function (x) { return num(x.collected); });
    c.costs = c.exp + c.incTotal; // salaries are kept separate from costs and from net profit
    c.net = c.rev - c.costs;
    c.receivable = c.rev - c.collected;
    c.payable = c.incTotal - c.incPaid;
    c.salDue = c.salTotal - c.salPaid;
    c.lastPaid = ''; c.overdue = 0;
    S.payroll.forEach(function (x) {
      if (x.paid === 'yes') { var pd = x.paidDate || x.date || ''; if (pd > c.lastPaid) c.lastPaid = pd; } else c.overdue++;
    });
    c.waste = sum(S.waste, function (x) { return num(x.qty) * num(x.unitCost); });
    c.paidCosts = c.exp + c.incPaid + c.salPaid;
    var ps = partners(), tot = 0;
    c.p = ps.map(function (p) {
      var funded = sum(S.funding, function (x) { return x.partner === p.name ? num(x.amount) : 0; });
      var direct = sum(S.expenses, function (x) { return x.paidBy === p.name ? num(x.amount) : 0; }) +
        sum(S.incoming, function (x) { return x.paidBy === p.name ? num(x.paid) : 0; }) +
        sum(S.payroll, function (x) { return x.paid === 'yes' && x.paidBy === p.name ? netOf(x) : 0; });
      tot += funded + direct;
      return { name: p.name, ratio: num(p.ratio), funded: funded, direct: direct, paid: funded + direct };
    });
    c.totalPaid = tot;
    c.p.forEach(function (p) { p.share = tot * p.ratio / 100; p.diff = p.paid - p.share; p.profit = c.net * p.ratio / 100; p.salShare = c.salTotal * p.ratio / 100; p.salDueShare = c.salDue * p.ratio / 100; });
    c.directAll = sum(c.p, function (p) { return p.direct; });
    c.fundCosts = c.paidCosts - c.directAll;
    c.cash = c.funding + c.collected - c.fundCosts;
    // products
    var names = {};
    ['production', 'outgoing', 'waste'].forEach(function (k) { S[k].forEach(function (x) { if (x.product) names[x.product] = 1; }); });
    c.products = Object.keys(names).map(function (n) {
      var pr = sum(S.production, function (x) { return x.product === n ? num(x.qty) : 0; });
      var so = sum(S.outgoing, function (x) { return x.product === n ? num(x.qty) : 0; });
      var wa = sum(S.waste, function (x) { return x.product === n ? num(x.qty) : 0; });
      return { n: n, pr: pr, so: so, wa: wa, left: pr - so - wa, pct: pr ? wa / pr * 100 : 0 };
    });
    // months
    var mo = {};
    function add(d, key, v) { if (!d) return; var m = String(d).slice(0, 7); mo[m] = mo[m] || { rev: 0, cost: 0, pay: 0 }; mo[m][key] += v; }
    S.outgoing.forEach(function (x) { add(x.date, 'rev', num(x.qty) * num(x.price)); });
    S.expenses.forEach(function (x) { add(x.date, 'cost', num(x.amount)); });
    S.incoming.forEach(function (x) { add(x.date, 'cost', num(x.qty) * num(x.price)); });
    S.payroll.forEach(function (x) { add(x.date, 'pay', netOf(x)); });
    c.months = Object.keys(mo).sort().reverse().map(function (m) { return { m: m, rev: mo[m].rev, cost: mo[m].cost, pay: mo[m].pay, net: mo[m].rev - mo[m].cost }; });
    // suggested transfers
    var debt = c.p.filter(function (p) { return p.diff < -0.005; }).map(function (p) { return { n: p.name, a: -p.diff }; }).sort(function (a, b) { return b.a - a.a; });
    var cred = c.p.filter(function (p) { return p.diff > 0.005; }).map(function (p) { return { n: p.name, a: p.diff }; }).sort(function (a, b) { return b.a - a.a; });
    c.transfers = [];
    var i = 0, j = 0;
    while (i < debt.length && j < cred.length) {
      var t = Math.min(debt[i].a, cred[j].a);
      if (t > 0.005) c.transfers.push({ from: debt[i].n, to: cred[j].n, a: t });
      debt[i].a -= t; cred[j].a -= t;
      if (debt[i].a < 0.005) i++; if (cred[j].a < 0.005) j++;
    }
    return c;
  }

  async function commit(op, coll, id, data, old, kind) {
    if (state.isAdmin) {
      var ref = dbh.collection(coll).doc(id);
      if (op === 'set') await ref.set(data); else if (op === 'update') await ref.update(data); else await ref.delete();
      return 'done';
    }
    var req = { op: op, coll: coll, id: id, kind: kind, by: state.myId || '', createdAt: Date.now(), status: 'pending' };
    if (data) req.data = data;
    if (old) req.old = old;
    await dbh.collection('pending').doc().set(req);
    return 'requested';
  }
  async function applyReq(r) {
    if (COLLS.indexOf(r.coll) < 0) throw { code: 'bad_request' };
    var ref = dbh.collection(r.coll).doc(r.id);
    if (r.op === 'set') await ref.set(r.data); else if (r.op === 'update') await ref.update(r.data); else if (r.op === 'delete') await ref.delete(); else throw { code: 'bad_request' };
    await dbh.collection('pending').doc(r.rid).delete();
  }
  async function reqAction(a, rid) {
    if (state.busy) return;
    var r = state.pending.filter(function (x) { return x.rid === rid; })[0]; if (!r) return;
    state.busy = true;
    try {
      if (a === 'approve') { await applyReq(r); toast('تمت الموافقة'); }
      else if (a === 'reject') { await dbh.collection('pending').doc(rid).update({ status: 'rejected' }); toast('تم رفض الطلب'); }
      else { await dbh.collection('pending').doc(rid).delete(); toast('تم الحذف'); }
    } catch (e) { toast(e && (e.code === 'invalid_argument' || e.code === 'bad_request') ? 'تعذّر التنفيذ، قد يكون السجل حُذف. ارفض الطلب.' : 'تعذّر التنفيذ، حاول مرة أخرى'); }
    state.busy = false;
  }

    else if (a === 'pay') openPay([b.getAttribute('data-id')]);
    else if (a === 'payall') openPay(null);
    else if (a === 'approve' || a === 'reject' || a === 'dismiss') reqAction(a, b.getAttribute('data-id'));
    else if (a === 'approveall') approveAll();
    else if (a === 'share') openShare();
    else if (a === 'editpaid') openPaid(b.getAttribute('data-n'));
    else if (a === 'savepaid') savePaid();
    else if (a === 'addfund') { var nm = paidName; openForm('funding'); var sel = $('f_partner'); if (sel) sel.value = nm; }
    else if (a === 'copyrep') copyReport();
    else if (a === 'backup') openBackup();
    else if (a === 'sharebackup') shareBackup();
    else if (a === 'copybackup') copyBackup();
    else if (a === 'restore') openRestore();
    else if (a === 'dorestore') doRestore();
    else if (a === 'noop') { }
    else if (a === 'equal') { var q = [33.33, 33.33, 33.34]; for (var i = 0; i < 3; i++) $('pr' + i).value = q[i]; }
  });

  // ---------- boot ----------
  async function boot() {
    render();
    var claude = window.claude;
    try { dbh = claude && await claude.use('db'); } catch (e) { dbh = null; }
    if (!dbh) { state.dbOk = false; render(); return; }
    try { var u = await claude.use('user'); userNs = u; if (u) { state.isAdmin = !!(await u.canEdit()); state.myId = await u.id(); } } catch (e) { }
    state.roleKnown = true;
    dbh.doc('settings/main').onSnapshot(function (s) { state.settings = s.exists ? s.data() : null; state.loaded.settings = true; schedule(); }, function () { state.loaded.settings = true; schedule(); });
    COLLS.forEach(function (name) {
      dbh.collection(name).onSnapshot(function (snap) {
        state[name] = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
        state.loaded[name] = true; schedule();
      }, function () { schedule(); });
    });
    dbh.collection('pending').onSnapshot(function (snap) {
      state.pending = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.rid = d.id; return o; });
      resolveNames(); schedule();
    }, function () { schedule(); });
    render();
  }
  boot();
})();
</script>
