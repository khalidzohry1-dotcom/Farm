      var fk = sum(S.funding, function (x) { return x.partner === p.name ? num(x.kwd) : 0; });
      tot += funded;
      return { name: p.name, ratio: num(p.ratio), funded: funded, fundedKwd: fk, direct: 0, directKwd: 0, paid: funded, paidKwd: fk };
    });
    c.totalPaid = tot;
    c.totalPaidKwd = sum(c.p, function (p) { return p.fundedKwd; });
    c.gaps = S.funding.filter(function (x) { return num(x.amount) > 0 && !(num(x.kwd) > 0); }).length;
    c.p.forEach(function (p) {
      p.shareKwd = c.totalPaidKwd * p.ratio / 100; p.diffKwd = p.paidKwd - p.shareKwd;
      p.share = tot * p.ratio / 100; p.diff = p.paid - p.share; p.profit = c.net * p.ratio / 100; p.salShare = c.salTotal * p.ratio / 100; p.salDueShare = c.salDue * p.ratio / 100;
      p.owedToMe = []; p.iOwe = [];
    });
    c.pairs = [];
    c.p.forEach(function (P) {
      c.p.forEach(function (Q) {
        if (P === Q) return;
        var g = P.funded * Q.ratio / 100 - Q.funded * P.ratio / 100, gk = P.fundedKwd * Q.ratio / 100 - Q.fundedKwd * P.ratio / 100;
        if (g > 0.005) { var t = { cred: P.name, debt: Q.name, egp: g, kwd: gk }; c.pairs.push(t); P.owedToMe.push(t); Q.iOwe.push(t); }
      });
    });
    c.directAll = 0;
    c.fundCosts = c.paidCosts;
    c.fromProceeds = 0; c.fromFunding = c.fundCosts;
    c.fundBal = c.funding + c.debtIn - c.fundCosts; c.procBal = c.collected;
    c.cash = c.funding + c.debtIn + c.collected - c.fundCosts;
    // products
    var names = {};
    ['production', 'outgoing', 'waste'].forEach(function (k) { S[k].forEach(function (x) { if (x.product) names[x.product] = 1; }); });
    c.products = Object.keys(names).map(function (n) {
      var pr = sum(S.production, function (x) { return x.product === n ? num(x.qty) : 0; });
      var so = sum(S.outgoing, function (x) { return x.product === n ? num(x.qty) : 0; });
      var wa = sum(S.waste, function (x) { return x.product === n ? num(x.qty) : 0; });
      return { n: n, pr: pr, so: so, wa: wa, left: pr - so - wa, pct: pr ? wa / pr * 100 : 0 };
    });
    // months
    var mo = {};
    function add(d, key, v) { if (!d) return; var m = String(d).slice(0, 7); mo[m] = mo[m] || { rev: 0, cost: 0, pay: 0 }; mo[m][key] += v; }
    S.outgoing.forEach(function (x) { add(x.date, 'rev', num(x.qty) * num(x.price)); });
    S.expenses.forEach(function (x) { add(x.date, 'cost', num(x.amount)); });
    S.incoming.forEach(function (x) { add(x.date, 'cost', num(x.qty) * num(x.price)); });
    S.payroll.forEach(function (x) { add(x.date, 'pay', netOf(x)); });
    c.months = Object.keys(mo).sort().reverse().map(function (m) { return { m: m, rev: mo[m].rev, cost: mo[m].cost, pay: mo[m].pay, net: mo[m].rev - mo[m].cost }; });
    // suggested transfers
    var debt = c.p.filter(function (p) { return p.diff < -0.005; }).map(function (p) { return { n: p.name, a: -p.diff }; }).sort(function (a, b) { return b.a - a.a; });
    var cred = c.p.filter(function (p) { return p.diff > 0.005; }).map(function (p) { return { n: p.name, a: p.diff }; }).sort(function (a, b) { return b.a - a.a; });
    c.transfers = [];
    var i = 0, j = 0;
    while (i < debt.length && j < cred.length) {
      var t = Math.min(debt[i].a, cred[j].a);
      if (t > 0.005) c.transfers.push({ from: debt[i].n, to: cred[j].n, a: t });
      debt[i].a -= t; cred[j].a -= t;
      if (debt[i].a < 0.005) i++; if (cred[j].a < 0.005) j++;
    }
    return c;
  }

    L.push('حساب الشركاء:');
    c.p.forEach(function (p) {
      L.push('- ' + p.name + ': موّل ' + fmt(p.paid) + (p.paidKwd > 0 ? ' (' + fmtN(p.paidKwd, 3) + ' د.ك)' : '') + '، حصته ' + fmt(p.share) + '، ' + (p.diff > 0.005 ? 'له ' + fmt(p.diff) : p.diff < -0.005 ? 'عليه ' + fmt(-p.diff) : 'متساوٍ'));
      p.owedToMe.forEach(function (t) { L.push('   له عند ' + t.debt + ': ' + fmt(t.egp) + (t.kwd > 0.0005 ? ' (' + fmtN(t.kwd, 3) + ' د.ك)' : '')); });
      p.iOwe.forEach(function (t) { L.push('   عليه لـ ' + t.cred + ': ' + fmt(t.egp) + (t.kwd > 0.0005 ? ' (' + fmtN(t.kwd, 3) + ' د.ك)' : '')); });
    });
    if (c.transfers.length) {
      L.push(''); L.push('التحويلات المقترحة:');
      var tr0 = num(state.settings && state.settings.todayRate);
      c.transfers.forEach(function (t) { L.push('- ' + t.from + ' يحوّل إلى ' + t.to + ': ' + fmt(t.a) + (tr0 > 0 ? ' (≈ ' + fmtN(t.a / tr0, 3) + ' د.ك بسعر ' + fmtN(tr0, 3) + ')' : '')); });
    }
    return L.join('\n');
  }
  function openShare() {
    if (!state.settings) { toast('أعدّ الشركاء أولًا'); return; }
    shareText = buildReport(cache || compute());
    openSheet(sheetTop('تقرير للشركاء') +
      '<div class="card"><pre id="reptxt" style="white-space:pre-wrap;word-break:break-word;margin:0;font-family:inherit;font-size:15px;line-height:1.7;user-select:text">' + esc(shareText) + '</pre></div>' +
      '<button class="btn" data-a="copyrep">نسخ النص</button>' +
      '<a class="btn ghost" style="display:grid;place-items:center;text-decoration:none" href="https://wa.me/?text=' + encodeURIComponent(shareText) + '" target="_blank" rel="noopener">فتح واتساب وإرسال</a>' +
      '<p class="small muted">يُرسل الملخص كنص عادي. اختر المجموعة أو الشريك من داخل واتساب.</p>');
  }
  function copyReport() {
    var done = function () { toast('تم نسخ التقرير'); };
    var fail = function () {
      try { var pre = $('reptxt'), r = document.createRange(); r.selectNodeContents(pre); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); } catch (x) { }
      toast('حدّد النص وانسخه يدويًا');
    };
    try { navigator.clipboard.writeText(shareText).then(done, fail); } catch (x) { fail(); }
  }
  var cur_edit = null;
  function openForm(type, rec) {
    var T = TYPES[type]; cur_edit = { type: type, id: rec ? rec.id : null, createdAt: rec ? rec.createdAt : null, old: rec ? stripId(rec) : null };
    var d = rec || {};
    if (!rec) { d = { date: today() };  if (type === 'payroll') { d.paid = 'yes'; } if (type === 'debts') { d.kind = 'onfarm'; d.status = 'unpaid'; } }
    var h = sheetTop((rec ? (state.isAdmin ? 'تعديل ' : 'طلب تعديل ') : (state.isAdmin ? 'تسجيل ' : 'طلب إضافة ')) + T.label) + '<form id="recform" novalidate>';
    var i = 0, fs = T.fields;
    while (i < fs.length) {
      if (fs[i].half && fs[i + 1] && fs[i + 1].half) { h += '<div class="two">' + fieldHtml(fs[i], d[fs[i].k]) + fieldHtml(fs[i + 1], d[fs[i + 1].k]) + '</div>'; i += 2; }
      else { h += fieldHtml(fs[i], d[fs[i].k]); i++; }
    }
    h += '<div id="calc"></div><div class="err" id="formerr" role="alert"></div><button type="submit" class="btn" id="savebtn">' + saveLabel(!!rec) + '</button>';
    if (rec) h += '<button type="button" class="btn danger" data-a="del" id="delbtn">' + delLabel() + '</button>';
    h += '</form>';
    openSheet(h);
    var form = $('recform');
    form.addEventListener('input', updateCalc); form.addEventListener('change', updateCalc);
    form.onsubmit = function (e) { e.preventDefault(); saveRecord(); };
    updateCalc();
  }
  function readForm(type) {
    var d = {}; TYPES[type].fields.forEach(function (f) {
      var el = $('f_' + f.k); var v = el ? el.value.trim() : '';
      if (f.t === 'money' || f.t === 'qty') d[f.k] = v === '' ? '' : num(v); else d[f.k] = v;
    }); return d;
  }
  function updateCalc(ev) {
    if (!cur_edit) return;
    if (cur_edit.type === 'funding' && ev && ev.target && (ev.target.id === 'f_kwd' || ev.target.id === 'f_rate')) {
      var kw = num($('f_kwd').value), rt = num($('f_rate').value);
      if (kw > 0 && rt > 0) $('f_amount').value = String(Math.round(kw * rt * 100) / 100);
    } else if (ev && ev.target && ['expenses', 'incoming', 'payroll', 'debts'].indexOf(cur_edit.type) >= 0 && ['f_amount', 'f_paid', 'f_base', 'f_allow', 'f_ded', 'f_rate', 'f_kwd'].indexOf(ev.target.id) >= 0) {
      var ty = cur_edit.type, fd = readForm(ty), bs = ty === 'payroll' ? netOf(fd) : ty === 'incoming' ? num(fd.paid) : num(fd.amount);
      if (ev.target.id === 'f_kwd') { if (num(fd.kwd) > 0 && bs > 0) $('f_rate').value = String(Math.round(bs / num(fd.kwd) * 10000) / 10000); }
      else if (num(fd.rate) > 0 && bs > 0) $('f_kwd').value = String(Math.round(bs / num(fd.rate) * 1000) / 1000);
    } var T = TYPES[cur_edit.type], box = $('calc'); if (!box) return;
    if (!T.calc) { box.innerHTML = ''; return; }
    box.innerHTML = T.calc(readForm(cur_edit.type)).map(function (r) { return '<div class="calc"><span>' + r[0] + '</span><span>' + N(r[1]) + ' ' + esc(cur()) + '</span></div>'; }).join('<div style="height:8px"></div>');
  }
  async function saveRecord() {
    var type = cur_edit.type, T = TYPES[type], d = readForm(type), err = $('formerr');
    for (var i = 0; i < T.fields.length; i++) { var f = T.fields[i]; if (f.req && (d[f.k] === '' || d[f.k] == null)) { err.textContent = 'املأ حقل «' + f.l + '»'; var el = $('f_' + f.k); if (el) el.focus(); return; } }
    for (var j = 0; j < T.fields.length; j++) { var g = T.fields[j]; if ((g.t === 'money' || g.t === 'qty') && d[g.k] !== '' && d[g.k] < 0) { err.textContent = 'لا يمكن أن تكون القيمة سالبة في «' + g.l + '»'; return; } }
    var btn = $('savebtn'); btn.disabled = true; err.textContent = '';
    try {
      if (type === 'debts') {
        if (d.status === 'paid') { if (!d.paidDate) d.paidDate = today(); } else { d.paidDate = ''; }
      }
      d.createdAt = cur_edit.createdAt || Date.now();
      var rid = cur_edit.id || dbh.collection(type).doc().id;
      var res = await commit('set', type, rid, d, cur_edit.old, cur_edit.id ? 'edit' : 'add');
      toast(res === 'requested' ? 'تم إرسال الطلب لموافقة صاحب الصفحة' : (cur_edit.id ? 'تم حفظ التعديل' : 'تم الحفظ'));
      closeSheet(); cur_edit = null;
    } catch (e) {
      btn.disabled = false;
      err.textContent = e && e.code === 'invalid_argument' ? 'ليست لديك صلاحية التسجيل. اطلب صلاحية «مساهم» من صاحب الصفحة.' : 'تعذّر الحفظ، حاول مرة أخرى.';
    }
  }
  var payIds = [];
  function openPay(ids) {
    var list = ids ? state.payroll.filter(function (x) { return ids.indexOf(x.id) >= 0; }) : state.payroll.filter(function (x) { return x.paid !== 'yes'; });
    if (!list.length) { toast('لا توجد رواتب متأخرة'); return; }
    payIds = list.map(function (x) { return x.id; });
    var h = sheetTop('تسجيل صرف الرواتب') + '<div class="card"><div class="lines" style="margin-top:0">' +
      list.map(function (x) { return '<div><span>' + esc(x.worker) + ' <span class="muted small"><span class="num">' + esc(String(x.date || '').slice(0, 7)) + '</span></span></span><span>' + N(netOf(x)) + '</span></div>'; }).join('') +
      '<div class="t"><span>الإجمالي</span><span>' + N(sum(list, netOf)) + ' ' + esc(cur()) + '</span></div></div></div>' +
      '<form id="payform" novalidate>' + fieldHtml({ k: 'payDate', t: 'date', l: 'تاريخ الصرف', req: 1 }, today()) +
      '<div class="err" id="payerr" role="alert"></div><button type="submit" class="btn" id="paysave">' + (state.isAdmin ? 'تأكيد الصرف' : 'إرسال للموافقة') + '</button></form>';
    openSheet(h);
    $('payform').onsubmit = function (e) { e.preventDefault(); savePay(); };
  }
  async function savePay() {
    var dt = $('f_payDate').value, err = $('payerr');
    if (!dt) { err.textContent = 'اكتب تاريخ الصرف'; return; }
    var btn = $('paysave'); btn.disabled = true; err.textContent = '';
    var done = 0;
    try {
      var res = 'done';
      for (var i = 0; i < payIds.length; i++) {
        var old = state.payroll.filter(function (x) { return x.id === payIds[i]; })[0];
        res = await commit('update', 'payroll', payIds[i], { paid: 'yes', paidDate: dt }, old ? stripId(old) : null, 'pay'); done++;
      }
      toast(res === 'requested' ? (done > 1 ? 'تم إرسال ' + done + ' طلبات للموافقة' : 'تم إرسال الطلب لموافقة صاحب الصفحة') : (done > 1 ? 'تم صرف ' + done + ' رواتب' : 'تم تسجيل الصرف')); closeSheet();
    } catch (e) {
      btn.disabled = false;
      err.textContent = done ? 'صُرف ' + done + ' فقط، حاول مرة أخرى للباقي.' : (e && e.code === 'invalid_argument' ? 'ليست لديك صلاحية التسجيل.' : 'تعذّر الحفظ، حاول مرة أخرى.');
    }
  }
  var delArmed = false;
  async function deleteRecord() {
    var b = $('delbtn');
    if (!delArmed) { delArmed = true; b.textContent = 'اضغط مرة أخرى لتأكيد الحذف'; setTimeout(function () { delArmed = false; if ($('delbtn')) $('delbtn').textContent = delLabel(); }, 4000); return; }
    delArmed = false; b.disabled = true;
    try { var res = await commit('delete', cur_edit.type, cur_edit.id, null, cur_edit.old, 'delete'); toast(res === 'requested' ? 'تم إرسال طلب الحذف لموافقة صاحب الصفحة' : 'تم الحذف'); closeSheet(); cur_edit = null; }
    catch (e) { b.disabled = false; $('formerr').textContent = 'تعذّر الحذف، حاول مرة أخرى.'; }
  }
  async function saveRate(e) {
    e.preventDefault();
    var r = num($('trate').value), err = $('rateerr');
    if (!(r > 0) || r > 10000) { err.textContent = 'اكتب سعر صرف صحيحًا أكبر من صفر'; return; }
    err.textContent = '';
    try { await dbh.doc('settings/main').set(Object.assign({}, state.settings, { todayRate: r, rateDate: today() })); toast('تم حفظ سعر اليوم'); }
    catch (x) { err.textContent = 'تعذّر الحفظ'; }
  }
  async function saveSettings(e) {
    e.preventDefault();
    var err = $('seterr'), ps = [], names = {};
    for (var i = 0; i < 3; i++) {
      var n = $('pn' + i).value.trim(), r = num($('pr' + i).value);
      if (!n) { err.textContent = 'اكتب اسم الشريك ' + (i + 1); return; }
      if (names[n]) { err.textContent = 'الأسماء يجب أن تكون مختلفة'; return; }
      if (r < 0 || r > 100) { err.textContent = 'النسبة بين 0 و100'; return; }
      names[n] = 1; ps.push({ name: n, ratio: r });
    }
    if (ps.every(function (p) { return Math.abs(p.ratio - 100 / 3) <= 0.011; })) ps.forEach(function (p) { p.ratio = 100 / 3; }); // equal thirds stored exactly
    var tot = sum(ps, function (p) { return p.ratio; });
    if (Math.abs(tot - 100) > 0.01) { err.textContent = 'مجموع النسب ' + fmt(tot) + '% ويجب أن يساوي 100%'; return; }
    err.textContent = '';
    try { await dbh.doc('settings/main').set({ partners: ps, currency: $('cur').value.trim() || 'جنيه', todayRate: (state.settings && state.settings.todayRate) || 0, rateDate: (state.settings && state.settings.rateDate) || '' }); toast('تم حفظ الإعدادات'); if (state.tab === 'settings') { state.tab = 'home'; render(); } }
    catch (x) { err.textContent = 'تعذّر الحفظ. تحتاج صلاحية «مساهم» على الأقل.'; }
  }

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
    var a = b.getAttribute('data-a'), t = b.getAttribute('data-t');
    if (a === 'tab') { state.tab = t; render(); window.scrollTo(0, 0); }
    else if (a === 'add') openChooser();
    else if (a === 'close') { closeSheet(); cur_edit = null; }
    else if (a === 'form') openForm(t);
    else if (a === 'rt') { state.recType = t; render(); }
    else if (a === 'open') { var rec = state[t].filter(function (x) { return x.id === b.getAttribute('data-id'); })[0]; if (rec) openForm(t, rec); }
    else if (a === 'del') deleteRecord();
    else if (a === 'pay') openPay([b.getAttribute('data-id')]);
    else if (a === 'payall') openPay(null);
    else if (a === 'approve' || a === 'reject' || a === 'dismiss') reqAction(a, b.getAttribute('data-id'));
    else if (a === 'approveall') approveAll();
    else if (a === 'share') openShare();
    else if (a === 'editpaid') openPaid(b.getAttribute('data-n'));
    else if (a === 'savepaid') savePaid();
    else if (a === 'addfund') { var nm = paidName; openForm('funding'); var sel = $('f_partner'); if (sel) sel.value = nm; }
    else if (a === 'copyrep') copyReport();
    else if (a === 'backup') openBackup();
    else if (a === 'sharebackup') shareBackup();
    else if (a === 'copybackup') copyBackup();
    else if (a === 'restore') openRestore();
    else if (a === 'dorestore') doRestore();
    else if (a === 'logout') window.__farmCloud.logout();
    else if (a === 'activity') openActivity();
    else if (a === 'actdel') hideAct(b.getAttribute('data-id'));
    else if (a === 'actclear') clearActs();
    else if (a === 'mkacct') makeAccount();
    else if (a === 'rmacct') { if (confirm('إيقاف دخول هذا الشريك؟')) window.__farmCloud.removeAccess(b.getAttribute('data-e')).then(function () { toast('تم الإيقاف'); }); }
    else if (a === 'migrate') runMigrate();
    else if (a === 'debtpay') debtPay(b.getAttribute('data-id'));
    else if (a === 'debtdel') debtDel(b.getAttribute('data-id'));
    else if (a === 'noop') { }
    else if (a === 'equal') { var q = [33.33, 33.33, 33.34]; for (var i = 0; i < 3; i++) $('pr' + i).value = q[i]; }
  });

  // ---------- boot ----------
  async function boot() {
    render();
    var claude = window.claude;
    try { dbh = claude && await claude.use('db'); } catch (e) { dbh = null; }
    if (!dbh) { state.dbOk = false; render(); return; }
    try { var u = await claude.use('user'); userNs = u; if (u) { state.isAdmin = !!(await u.canEdit()); state.isOwner = u.isOwner ? !!(await u.isOwner()) : state.isAdmin; state.myId = await u.id(); } } catch (e) { }
    state.roleKnown = true;
    dbh.doc('settings/main').onSnapshot(function (s) { state.settings = s.exists ? s.data() : null; state.loaded.settings = true; schedule(); }, function () { state.loaded.settings = true; schedule(); });
    COLLS.forEach(function (name) {
      dbh.collection(name).onSnapshot(function (snap) {
        state[name] = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
        state.loaded[name] = true; schedule();
      }, function () { schedule(); });
    });
    dbh.collection('pending').onSnapshot(function (snap) {
      state.pending = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.rid = d.id; return o; });
      resolveNames(); schedule();
    }, function () { schedule(); });
    render();
  }
  boot();
})();
</script>
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
